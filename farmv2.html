<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GROW FARM - Farmer's Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #fcf8f0 0%, #e8f5e9 100%);
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #fcf8f0; }
        ::-webkit-scrollbar-thumb { background: #15803d; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #16a34a; }
        #mobile-menu {
            transition: max-height 0.3s ease-out, opacity 0.3s ease-out;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
        }
        #mobile-menu.open {
            max-height: 300px;
            opacity: 1;
        }
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .cart-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #dc2626;
            color: white;
            border-radius: 9999px;
            padding: 2px 6px;
            font-size: 0.7rem;
            font-weight: bold;
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Loading Screen -->
    <div id="loading-screen" class="fixed inset-0 bg-gradient-to-br from-green-50 to-green-100 flex items-center justify-center z-50">
        <div class="text-center">
            <svg class="animate-spin h-12 w-12 text-green-700 mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span class="text-xl text-green-700 font-semibold mt-4 block">Loading GROW FARM...</span>
        </div>
    </div>

    <!-- Navbar -->
    <header id="navbar" class="bg-green-800 text-white shadow-lg fixed top-0 left-0 right-0 z-40 hidden">
        <div class="container mx-auto px-4 sm:px-8 flex justify-between items-center py-3">
            <div class="flex items-center cursor-pointer" onclick="navigate('marketplace')">
                <div class="w-10 h-10 bg-green-600 rounded-full flex items-center justify-center text-2xl mr-3">🌾</div>
                <h1 class="text-2xl font-bold font-serif">GROW FARM</h1>
            </div>
            
            <!-- Desktop Nav -->
            <nav class="hidden sm:flex space-x-4 items-center">
                <button id="nav-marketplace" onclick="navigate('marketplace')" class="nav-button flex items-center px-4 py-2 rounded-full transition duration-200 hover:bg-green-700 bg-green-600">
                    <i data-lucide="shopping-bag" class="w-5 h-5 mr-2"></i> Market
                </button>
                <button id="nav-create" onclick="navigate('create')" class="nav-button flex items-center px-4 py-2 rounded-full transition duration-200 hover:bg-green-700">
                    <i data-lucide="plus-circle" class="w-5 h-5 mr-2"></i> List Item
                </button>
                <button id="nav-cart" onclick="navigate('cart')" class="nav-button flex items-center px-4 py-2 rounded-full transition duration-200 hover:bg-green-700 relative">
                    <i data-lucide="shopping-cart" class="w-5 h-5 mr-2"></i> Cart
                    <span id="cart-badge" class="cart-badge hidden">0</span>
                </button>
                <button id="nav-profile" onclick="navigate('profile')" class="nav-button flex items-center px-4 py-2 rounded-full transition duration-200 hover:bg-green-700">
                    <i data-lucide="user" class="w-5 h-5 mr-2"></i> Profile
                </button>
                <button onclick="logout()" class="flex items-center px-4 py-2 rounded-full bg-red-600 hover:bg-red-700 transition">
                    <i data-lucide="log-out" class="w-5 h-5 mr-2"></i> Logout
                </button>
            </nav>

            <!-- Mobile Menu Button -->
            <button class="sm:hidden text-white p-2 rounded-md hover:bg-green-700" onclick="toggleMobileMenu()" aria-label="Toggle mobile menu" title="Toggle mobile menu">
                <svg id="menu-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
            </button>
        </div>
        
        <!-- Mobile Nav Menu -->
        <div id="mobile-menu" class="sm:hidden bg-green-700">
            <nav class="flex flex-col p-4 space-y-2">
                <button id="mobile-nav-marketplace" onclick="navigate('marketplace')" class="nav-button flex items-center p-3 rounded-lg bg-green-600 hover:bg-green-500 transition">
                    <i data-lucide="shopping-bag" class="w-5 h-5 mr-2"></i> Market
                </button>
                <button id="mobile-nav-create" onclick="navigate('create')" class="nav-button flex items-center p-3 rounded-lg hover:bg-green-600 transition">
                    <i data-lucide="plus-circle" class="w-5 h-5 mr-2"></i> List Item
                </button>
                <button id="mobile-nav-cart" onclick="navigate('cart')" class="nav-button flex items-center p-3 rounded-lg hover:bg-green-600 transition relative">
                    <i data-lucide="shopping-cart" class="w-5 h-5 mr-2"></i> Cart
                    <span id="mobile-cart-badge" class="cart-badge hidden">0</span>
                </button>
                <button id="mobile-nav-profile" onclick="navigate('profile')" class="nav-button flex items-center p-3 rounded-lg hover:bg-green-600 transition">
                    <i data-lucide="user" class="w-5 h-5 mr-2"></i> Profile
                </button>
                <button onclick="logout()" class="flex items-center p-3 rounded-lg bg-red-600 hover:bg-red-700 transition">
                    <i data-lucide="log-out" class="w-5 h-5 mr-2"></i> Logout
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main id="app-container" class="container mx-auto px-4 sm:px-8 min-h-screen" style="display:none;">
        <!-- Dynamic content here -->
    </main>

    <!-- Modal -->
    <div id="custom-modal" class="fixed inset-0 bg-gray-900 bg-opacity-70 flex items-center justify-center z-50 p-4 hidden">
        <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm">
            <div class="flex justify-between items-start">
                <h3 id="modal-title" class="text-xl font-bold text-green-700">Notification</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600" title="Close modal">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <p id="modal-message" class="mt-4 text-gray-600"></p>
            <button onclick="closeModal()" class="mt-6 w-full bg-green-600 text-white font-semibold py-2 rounded-lg hover:bg-green-700">
                Close
            </button>
        </div>
    </div>

    <script>
        // ===== FIREBASE CONFIGURATION =====
        // IMPORTANT: Replace with your own Firebase config from Firebase Console
        const firebaseConfig = {
  apiKey: "AIzaSyAN8mCofjZrEH6veFc9WbK7QWc9E6O33CM",
  authDomain: "growfarm-589e4.firebaseapp.com",
  projectId: "growfarm-589e4",
  storageBucket: "growfarm-589e4.firebasestorage.app",
  messagingSenderId: "412757683985",
  appId: "1:412757683985:web:733010a1d0b5a035a126b0",
  measurementId: "G-13ZKXH5JJX"
};


        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // ===== APP STATE =====
        const appState = {
            user: null,
            listings: [],
            orders: [],
            cart: [],
            filterType: 'all',
            searchTerm: '',
            currentView: 'auth',
            unsubscribeListings: null,
            unsubscribeOrders: null
        };

        // ===== FIREBASE AUTH FUNCTIONS =====
        async function handleRegister(formData) {
            try {
                // Create Firebase auth user
                const userCredential = await auth.createUserWithEmailAndPassword(
                    formData.email, 
                    formData.password
                );
                
                // Store additional user data in Firestore
                await db.collection('users').doc(userCredential.user.uid).set({
                    name: formData.name,
                    email: formData.email,
                    region: formData.region,
                    role: formData.role,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                showModal('Success', 'Registration successful! Welcome to GROW FARM.');
            } catch (error) {
                console.error('Registration error:', error);
                showModal('Error', error.message);
            }
        }

        async function handleLogin(email, password) {
            try {
                await auth.signInWithEmailAndPassword(email, password);
                // User data will be loaded by onAuthStateChanged listener
            } catch (error) {
                console.error('Login error:', error);
                showModal('Error', error.message);
            }
        }

        async function logout() {
            try {
                // Unsubscribe from listeners
                if (appState.unsubscribeListings) {
                    appState.unsubscribeListings();
                }
                if (appState.unsubscribeOrders) {
                    appState.unsubscribeOrders();
                }
                
                await auth.signOut();
                appState.user = null;
                appState.cart = [];
                appState.listings = [];
                appState.orders = [];
                document.getElementById('navbar').classList.add('hidden');
                navigate('auth');
                showModal('Logged Out', 'You have been successfully logged out.');
            } catch (error) {
                console.error('Logout error:', error);
                showModal('Error', error.message);
            }
        }

        // ===== FIREBASE AUTH STATE LISTENER =====
        auth.onAuthStateChanged(async (firebaseUser) => {
            if (firebaseUser) {
                // User is signed in
                try {
                    const userDoc = await db.collection('users').doc(firebaseUser.uid).get();
                    if (userDoc.exists) {
                        appState.user = {
                            id: firebaseUser.uid,
                            ...userDoc.data()
                        };
                        
                        console.log('User logged in:', appState.user);
                        
                        showNavbar();
                        loadListings();
                        
                        // Load orders with a small delay to ensure user is set
                        setTimeout(() => {
                            console.log('Loading orders after login...');
                            loadOrders();
                        }, 500);
                        
                        if (appState.currentView === 'auth') {
                            navigate('marketplace');
                        } else {
                            render();
                        }
                    }
                } catch (error) {
                    console.error('Error loading user data:', error);
                }
            } else {
                // User is signed out
                if (appState.currentView !== 'auth') {
                    navigate('auth');
                }
            }
            
            // Hide loading screen
            document.getElementById('loading-screen').style.display = 'none';
            document.getElementById('app-container').style.display = 'block';
        });

        // ===== FIRESTORE ORDERS FUNCTIONS =====
        function loadOrders() {
            if (!appState.user || !appState.user.id) {
                console.warn('Cannot load orders: No user logged in');
                return;
            }

            // Unsubscribe from previous listener if exists
            if (appState.unsubscribeOrders) {
                appState.unsubscribeOrders();
            }

            // Set up two listeners: one for orders placed by user, one for orders received
            const userId = appState.user.id;
            
            // Orders placed by the current user (as buyer)
            const buyerQuery = db.collection('orders')
                .where('buyerId', '==', userId);

            // Orders received by the current user (as seller)
            const sellerQuery = db.collection('orders')
                .where('sellerId', '==', userId);

            // Composite listener setup
            const unsubscribeBuyer = buyerQuery.onSnapshot(
                snapshot => {
                    const buyerOrders = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data(),
                        type: 'placed'  // Flag to identify order type in UI
                    }));
                    updateOrders(buyerOrders, 'buyer');
                },
                error => {
                    console.error('Error loading buyer orders:', error);
                    if (error.code === 'permission-denied') {
                        showModal('Error', 'You do not have permission to view these orders.');
                    } else if (error.code === 'failed-precondition') {
                        const indexUrl = error.message.match(/https:\/\/console\.firebase\.google\.com[^\s]*/);
                        showModal('Index Required', `Please create the required index: ${indexUrl ? indexUrl[0] : error.message}`);
                    } else {
                        showModal('Error', `Error loading your orders: ${error.message}`);
                    }
                }
            );

            const unsubscribeSeller = sellerQuery.onSnapshot(
                snapshot => {
                    const sellerOrders = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data(),
                        type: 'received'  // Flag to identify order type in UI
                    }));
                    updateOrders(sellerOrders, 'seller');
                },
                error => {
                    console.error('Error loading seller orders:', error);
                    if (error.code === 'failed-precondition') {
                        const indexUrl = error.message.match(/https:\/\/console\.firebase\.google\.com[^\s]*/);
                        showModal('Index Required', `Please create the required index: ${indexUrl ? indexUrl[0] : error.message}`);
                    } else {
                        showModal('Error', `Error loading received orders: ${error.message}`);
                    }
                }
            );

            // Store unsubscribe functions
            appState.unsubscribeOrders = () => {
                unsubscribeBuyer();
                unsubscribeSeller();
            };
        }

        function updateOrders(newOrders, type) {
            // Update only the relevant portion of orders while preserving the other type
            const otherOrders = appState.orders.filter(order => 
                (type === 'buyer' ? order.type === 'received' : order.type === 'placed')
            );
            appState.orders = [...otherOrders, ...newOrders].sort((a, b) => 
                (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0)
            );
            render(); // Update UI with new orders
        }

        // ===== FIRESTORE LISTINGS FUNCTIONS =====
        function loadListings() {
            // Real-time listener for listings
            appState.unsubscribeListings = db.collection('listings')
                .orderBy('createdAt', 'desc')
                .onSnapshot((snapshot) => {
                    appState.listings = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    render();
                }, (error) => {
                    console.error('Error loading listings:', error);
                    showModal('Error', 'Failed to load listings');
                });
        }

        async function createOrder(listingId, quantity, totalAmount) {
            if (!appState.user || !appState.user.id) {
                throw new Error('You must be logged in to place an order');
            }

            const listing = appState.listings.find(l => l.id === listingId);
            if (!listing) {
                throw new Error('Listing not found');
            }

            try {
                // Create the order in Firestore
                const orderData = {
                    buyerId: appState.user.id,
                    buyerName: appState.user.name,
                    sellerId: listing.sellerId,
                    sellerName: listing.sellerName,
                    listingId: listing.id,
                    listingTitle: listing.title,
                    quantity: quantity,
                    totalAmount: totalAmount,
                    status: 'pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    type: listing.type,
                    region: listing.region,
                    pricePerUnit: listing.price
                };

                await db.collection('orders').add(orderData);
                
                // Clear the related item from cart
                appState.cart = appState.cart.filter(item => item.listingId !== listingId);
                updateCartBadge();
                
                return true;
            } catch (error) {
                console.error('Error creating order:', error);
                throw error;
            }
        }

        async function createListing(listingData) {
            try {
                await db.collection('listings').add({
                    ...listingData,
                    sellerId: appState.user.id,
                    sellerName: appState.user.name,
                    sellerRegion: appState.user.region,
                    sellerEmail: appState.user.email,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                showModal('Success', 'Listing created successfully!');
                navigate('marketplace');
            } catch (error) {
                console.error('Error creating listing:', error);
                showModal('Error', 'Failed to create listing: ' + error.message);
            }
        }

        async function deleteListing(listingId) {
            if (!confirm('Are you sure you want to delete this listing?')) {
                return;
            }
            
            try {
                await db.collection('listings').doc(listingId).delete();
                showModal('Success', 'Listing deleted successfully!');
            } catch (error) {
                console.error('Error deleting listing:', error);
                showModal('Error', 'Failed to delete listing: ' + error.message);
            }
        }



        // ===== CART FUNCTIONS =====
        function addToCart(listing) {
            // Ensure listing has all required fields
            if (!listing || !listing.id) {
                showModal('Error', 'Invalid listing data');
                return;
            }
            
            const existing = appState.cart.find(item => item.id === listing.id);
            if (existing) {
                existing.quantity++;
            } else {
                // Create cart item with all necessary fields
                const cartItem = {
                    id: listing.id,
                    title: listing.title || 'Unknown Product',
                    description: listing.description || '',
                    price: Number(listing.price) || 0,
                    type: listing.type || 'unknown',
                    quantity: 1,
                    sellerId: listing.sellerId || 'unknown',
                    sellerName: listing.sellerName || 'Unknown Seller',
                    sellerEmail: listing.sellerEmail || 'no-email@example.com',
                    sellerRegion: listing.sellerRegion || 'Unknown Region'
                };
                appState.cart.push(cartItem);
            }
            updateCartBadge();
            showModal('Added to Cart', `${listing.title || 'Item'} has been added to your cart.`);
        }

        function removeFromCart(listingId) {
            appState.cart = appState.cart.filter(item => item.id !== listingId);
            updateCartBadge();
            render();
        }

        function updateQuantity(listingId, delta) {
            const item = appState.cart.find(i => i.id === listingId);
            if (item) {
                item.quantity = Math.max(1, item.quantity + delta);
                render();
                updateCartBadge();
            }
        }

        function updateCartBadge() {
            const total = appState.cart.reduce((sum, item) => sum + item.quantity, 0);
            const badge = document.getElementById('cart-badge');
            const mobileBadge = document.getElementById('mobile-cart-badge');
            
            if (total > 0) {
                badge.textContent = total;
                mobileBadge.textContent = total;
                badge.classList.remove('hidden');
                mobileBadge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
                mobileBadge.classList.add('hidden');
            }
        }

        async function checkout(checkoutData) {
            if (appState.cart.length === 0) {
                showModal('Empty Cart', 'Your cart is empty. Add items before checkout.');
                return;
            }
            
            try {
                const total = appState.cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                
                // Create order document in Firestore
                const orderData = {
                    buyerId: appState.user.id,
                    buyerName: appState.user.name,
                    buyerEmail: appState.user.email,
                    buyerContact: checkoutData.contact,
                    deliveryAddress: checkoutData.address,
                    paymentMethod: checkoutData.paymentMethod,
                    items: appState.cart.map(item => ({
                        listingId: item.id,
                        title: item.title,
                        price: item.price,
                        quantity: item.quantity,
                        sellerId: item.sellerId,
                        sellerName: item.sellerName,
                        sellerEmail: item.sellerEmail
                    })),
                    totalAmount: total,
                    status: 'pending',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                };
                
                await db.collection('orders').add(orderData);
                
                showModal('Order Placed!', `Your order has been placed successfully! Total: ₹${total.toFixed(2)}. The sellers will contact you soon at ${checkoutData.contact}.`);
                appState.cart = [];
                updateCartBadge();
                navigate('marketplace');
            } catch (error) {
                console.error('Checkout error:', error);
                showModal('Error', 'Failed to place order: ' + error.message);
            }
        }

        // ===== NAVIGATION =====
        function navigate(view) {
            appState.currentView = view;
            
            document.querySelectorAll('.nav-button').forEach(btn => {
                btn.classList.remove('bg-green-600');
            });
            
            const navEl = document.getElementById(`nav-${view}`);
            const mobileNavEl = document.getElementById(`mobile-nav-${view}`);
            if (navEl) navEl.classList.add('bg-green-600');
            if (mobileNavEl) mobileNavEl.classList.add('bg-green-600');
            
            const mobileMenu = document.getElementById('mobile-menu');
            if (mobileMenu?.classList.contains('open')) {
                toggleMobileMenu();
            }
            
            render();
        }

        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('open');
            const icon = document.getElementById('menu-icon');
            if (menu.classList.contains('open')) {
                icon.innerHTML = '<line x1="18" x2="6" y1="6" y2="18"/><line x1="6" x2="18" y1="6" y2="18"/>';
            } else {
                icon.innerHTML = '<line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/>';
            }
        }

        function showNavbar() {
            document.getElementById('navbar').classList.remove('hidden');
            // Hide create button for buyers
            if (appState.user.role === 'buyer') {
                document.getElementById('nav-create')?.classList.add('hidden');
                document.getElementById('mobile-nav-create')?.classList.add('hidden');
            }
        }

        // ===== MODAL =====
        function showModal(title, message) {
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            document.getElementById('custom-modal').classList.remove('hidden');
            lucide.createIcons();
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        // ===== RENDER =====
        function render() {
            const container = document.getElementById('app-container');
            let content = '';
            
            switch (appState.currentView) {
                case 'auth':
                    content = renderAuthView();
                    break;
                case 'marketplace':
                    content = renderMarketplace();
                    break;
                case 'create':
                    content = renderCreateListing();
                    break;
                case 'cart':
                    content = renderCart();
                    break;
                case 'profile':
                    content = renderProfile();
                    break;
            }
            
            container.innerHTML = content;
            lucide.createIcons();
        }

        // ===== VIEW RENDERERS =====
        function renderAuthView() {
            return `
                <div class="min-h-screen flex items-center justify-center py-12">
                    <div class="max-w-md w-full">
                        <div class="text-center mb-8">
                            <div class="w-20 h-20 bg-green-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-4">🌾</div>
                            <h1 class="text-4xl font-bold text-green-800 mb-2">GROW FARM</h1>
                            <p class="text-gray-600">Connecting Farmers & Buyers</p>
                        </div>
                        
                        <div class="bg-white rounded-2xl shadow-2xl p-8 fade-in">
                            <div class="flex mb-6 bg-gray-100 rounded-lg p-1">
                                <button id="login-tab" onclick="switchAuthTab('login')" class="flex-1 py-2 rounded-lg font-semibold transition bg-white text-green-700 shadow">Login</button>
                                <button id="register-tab" onclick="switchAuthTab('register')" class="flex-1 py-2 rounded-lg font-semibold transition text-gray-600">Register</button>
                            </div>
                            
                            <div id="login-form">
                                <form onsubmit="event.preventDefault(); submitLogin(this);" class="space-y-4">
                                    <div>
                                        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>

                                                        <p class="text-xs text-gray-500">Seller: ${item.sellerName || 'Unknown'}</p>
                                                    </div>
                                                    <span class="font-semibold">₹${((item.price || 0) * (item.quantity || 0)).toFixed(2)}</span>
                                                </div>
                                            `).join('') : '<p class="text-sm text-gray-500">No items</p>'}
                                        </div>
                                        
                                        <div class="border-t pt-4">
                                            <p class="text-sm mb-2"><span class="font-medium">Delivery Address:</span> ${order.deliveryAddress || 'N/A'}</p>
                                            <p class="text-sm mb-2"><span class="font-medium">Payment Method:</span> ${order.paymentMethod ? order.paymentMethod.replace('_', ' ').toUpperCase() : 'N/A'}</p>
                                            <div class="flex justify-between items-center mt-4">
                                                <span class="font-bold">Total Amount:</span>
                                                <span class="text-2xl font-bold text-green-700">₹${(order.totalAmount || 0).toFixed(2)}</span>
                                            </div>
                                        </div>
                                    </div>
                                `;
                                }).join('')}
                            </div>
                        ` : `
                            <div class="bg-white p-8 rounded-xl shadow text-center">
                                <p class="text-gray-500 mb-4">You haven't placed any orders yet.</p>
                                <button onclick="navigate('marketplace')" class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 transition">
                                    Browse Marketplace
                                </button>
                                <button onclick="loadOrders()" class="ml-2 bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">
                                    Refresh Orders
                                </button>
                            </div>
                        `}
                    `}
                </div>
            `;
        }

        // ===== FORM HANDLERS =====
        function switchAuthTab(tab) {
            const loginTab = document.getElementById('login-tab');
            const registerTab = document.getElementById('register-tab');
            const loginForm = document.getElementById('login-form');
            const registerForm = document.getElementById('register-form');

            if (tab === 'login') {
                loginTab.classList.add('bg-white', 'text-green-700', 'shadow');
                loginTab.classList.remove('text-gray-600');
                registerTab.classList.remove('bg-white', 'text-green-700', 'shadow');
                registerTab.classList.add('text-gray-600');
                loginForm.classList.remove('hidden');
                registerForm.classList.add('hidden');
            } else {
                registerTab.classList.add('bg-white', 'text-green-700', 'shadow');
                registerTab.classList.remove('text-gray-600');
                loginTab.classList.remove('bg-white', 'text-green-700', 'shadow');
                loginTab.classList.add('text-gray-600');
                registerForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
            }
        }

        async function submitLogin(form) {
            const email = form.email.value;
            const password = form.password.value;
            await handleLogin(email, password);
        }

        async function submitRegister(form) {
            const formData = {
                name: form.name.value,
                email: form.email.value,
                password: form.password.value,
                region: form.region.value,
                role: form.role.value
            };
            await handleRegister(formData);
        }

        function updateListingFormFields() {
            const type = document.getElementById('listing-type').value;
            const saleTypeContainer = document.getElementById('sale-type-container');
            const priceLabel = document.getElementById('price-label');

            if (type === 'tool') {
                saleTypeContainer.style.display = 'block';
                const saleType = document.getElementById('sale-type').value;
                priceLabel.textContent = saleType === 'sale' ? 'Price (₹) *' : 'Rental Rate (₹/day) *';
            } else {
                saleTypeContainer.style.display = 'none';
                priceLabel.textContent = 'Price per Unit (₹) *';
            }
        }

        async function submitCreateListing(form) {
            const listingData = {
                type: form.type.value,
                saleType: form.type.value === 'tool' ? form.saleType.value : null,
                title: form.title.value,
                description: form.description.value,
                price: parseFloat(form.price.value)
            };
            
            await createListing(listingData);
        }

        async function submitCheckout(form) {
            const checkoutData = {
                contact: form.contact.value,
                address: form.address.value,
                paymentMethod: form.paymentMethod.value
            };
            
            await checkout(checkoutData);
        }
        // Initialize the app on page load
window.addEventListener('DOMContentLoaded', () => {
    lucide.createIcons();
    render(); // Initial render to show auth screen
});

    </script>
</body>
</html>
